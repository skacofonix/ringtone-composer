# Weekly dependency updates, grouped to keep the number of pull requests low.
# Security updates are separate and immediate (enabled in the repository settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # Node types must match the Node version of .nvmrc (24).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7 (native rewrite): wait until svelte-check supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
