name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security problems must be reported privately: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I pressed key 8 in retro mode and the note did not get shorter…
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Retro 3310
        - Modern
        - Both / not related to a mode
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or computer, and browser
      placeholder: iPhone 15, Safari / Pixel 8, Chrome / Windows 11, Edge
    validations:
      required: true
  - type: dropdown
    id: installed
    attributes:
      label: Installed as an app?
      options:
        - No, in the browser
        - Yes, installed on the home screen
  - type: textarea
    id: rtttl
    attributes:
      label: RTTTL of the melody (optional)
      description: Menu More → RTTTL text → Copy. It helps to reproduce the problem.
      render: text
