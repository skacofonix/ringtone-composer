<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compose ringtones like on a Nokia 3310 / Compose tes sonneries comme sur un Nokia 3310."
    />
    <!-- Browser bar color, per theme (updated by ui/shared/theme.svelte.ts). -->
    <meta
      name="theme-color"
      content="#f4f5f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#14161b"
      media="(prefers-color-scheme: dark)"
    />
    <title>RingtoneComposer</title>
    <script>
      // Apply a forced theme before the first paint, to avoid a flash of the
      // wrong theme. Same storage key as ui/shared/theme.svelte.ts.
      try {
        const theme = localStorage.getItem('ringtone-composer:theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Storage blocked: follow the system theme.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
